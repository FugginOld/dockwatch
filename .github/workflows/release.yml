name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  docker:
    name: docker
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.BOT_USERNAME }}
          password: ${{ secrets.BOT_GHCR_PAT }}
          registry: ghcr.io

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      # Build binary and stage it where dockers_v2 expects it
      - name: Build app
        run: |
          CGO_ENABLED=0 go build -ldflags "-X github.com/fugginold/dockwatch/internal/meta.Version=${GITHUB_REF_NAME}" -o dockwatch
          mkdir -p linux/amd64
          cp dockwatch linux/amd64/dockwatch

      # Build local image
      - name: Build Docker image (test)
        run: docker build --build-arg TARGETPLATFORM=linux/amd64 -t dockwatch:test .

      # Health test container
      - name: Test container
        run: |
          chmod +x scripts/test-container.sh
          scripts/test-container.sh dockwatch:test

      # Restore permissions changed by chmod so GoReleaser sees a clean tree
      - name: Restore modified files
        run: git restore scripts/test-container.sh 2>/dev/null || true

      # Only release if container is healthy
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Update rollback pointer
      - name: Update stable tag
        run: |
          git tag -f stable
          git push origin stable --force
