name: Update Changelog (Unreleased)

on:
  push:
    branches: [main]
    # Prevent an infinite loop when the bot commits CHANGELOG.md updates.
    paths-ignore:
      - "CHANGELOG.md"

concurrency:
  group: changelog-unreleased
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update CHANGELOG.md (Unreleased)
        run: |
          python scripts/update_changelog_unreleased.py CHANGELOG.md

      - name: Detect CHANGELOG.md changes
        id: diff
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open/Update PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(changelog): update Unreleased section"
          title: "chore(changelog): update Unreleased section"
          body: |
            Automated update of the `Unreleased` section in `CHANGELOG.md` based on commits on `main`.

            This is opened as a PR to comply with repository rules that block direct pushes to `main`.
          branch: "chore/changelog-unreleased"
          delete-branch: true
          add-paths: |
            CHANGELOG.md
