name: Update Changelog (Unreleased)

on:
  push:
    branches: [main]
    # Prevent an infinite loop when the bot commits CHANGELOG.md updates.
    paths-ignore:
      - "CHANGELOG.md"

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update CHANGELOG.md (Unreleased)
        run: |
          python scripts/update_changelog_unreleased.py CHANGELOG.md

      - name: Commit CHANGELOG.md if changed
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "No changelog update required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(changelog): update Unreleased section"
          git push
