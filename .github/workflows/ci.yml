name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache: true
      - run: go mod download
      - run: go build ./...
      - run: go test ./...
      - run: go vet ./...

  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Run govulncheck with allowlist policy
        shell: bash
        run: |
          set -euo pipefail
          ALLOWLIST_FILE=.github/security/govuln-allowlist.txt

          if [[ ! -f "$ALLOWLIST_FILE" ]]; then
            echo "::error::Missing vulnerability allowlist: $ALLOWLIST_FILE"
            exit 1
          fi

          SCAN_EXIT=0
          govulncheck ./... > govulncheck.out 2>&1 || SCAN_EXIT=$?
          cat govulncheck.out

          FOUND_IDS=$(grep -oE 'GO-[0-9]{4}-[0-9]+' govulncheck.out | tr -d '\r' | sort -u || true)
          if [[ -z "$FOUND_IDS" ]]; then
            if [[ "$SCAN_EXIT" -ne 0 ]]; then
              echo "::error::govulncheck failed without producing vulnerability IDs"
              exit "$SCAN_EXIT"
            fi
            echo "No vulnerabilities found by govulncheck"
            exit 0
          fi

          ALLOWLIST_IDS=$(grep -vE '^[[:space:]]*#|^[[:space:]]*$' "$ALLOWLIST_FILE" | tr -d '\r' | sort -u)
          UNEXPECTED_IDS=$(comm -23 <(printf '%s\n' "$FOUND_IDS") <(printf '%s\n' "$ALLOWLIST_IDS") || true)

          if [[ -n "$UNEXPECTED_IDS" ]]; then
            echo "::error::Unexpected vulnerabilities found (not allowlisted):"
            echo "$UNEXPECTED_IDS"
            exit 1
          fi

          echo "::warning::Only allowlisted vulnerabilities were found:"
          echo "$FOUND_IDS"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t dockwatch:ci .

  publish:
    name: Publish image
    needs: [build-test, vuln, docker-build]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only let this tag own :latest if it is the highest released version, so a
      # backport or an accidental low tag can never downgrade :latest.
      - name: Decide whether this version owns :latest
        id: guard
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          cur="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$cur" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "is_highest=false" >> "$GITHUB_OUTPUT"
            echo "non-release tag ($cur): not touching :latest"; exit 0
          fi
          token=$(curl -sf "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r .token)
          # ponytail: single tags/list page (n=1000); paginate if tag count ever exceeds that.
          existing=$(curl -sf -H "Authorization: Bearer $token" \
            "https://ghcr.io/v2/${repo}/tags/list?n=1000" \
            | jq -r '.tags[]?' | sed -n 's/^v\?\([0-9]\+\.[0-9]\+\.[0-9]\+\)$/\1/p')
          highest=$(printf '%s\n%s\n' "$existing" "$cur" | sort -V | tail -1)
          echo "current=$cur highest=$highest"
          [ "$highest" = "$cur" ] \
            && echo "is_highest=true" >> "$GITHUB_OUTPUT" \
            || echo "is_highest=false" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.guard.outputs.is_highest }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
