name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
    tags: ['v*']
    # Docs-only branch pushes skip CI, so a typo fix does not rebuild and
    # republish the multi-arch image. Tag pushes are unaffected: GitHub does
    # not evaluate path filters for tags, so releases still publish.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache: true
      - run: go mod download
      - run: go build ./...
      - run: go test ./...
      - run: go vet ./...
      # Nothing enforced formatting, so it had drifted across several files unnoticed.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Run govulncheck with allowlist policy
        shell: bash
        run: |
          set -euo pipefail
          ALLOWLIST_FILE=.github/security/govuln-allowlist.txt

          if [[ ! -f "$ALLOWLIST_FILE" ]]; then
            echo "::error::Missing vulnerability allowlist: $ALLOWLIST_FILE"
            exit 1
          fi

          SCAN_EXIT=0
          govulncheck ./... > govulncheck.out 2>&1 || SCAN_EXIT=$?
          cat govulncheck.out

          # Scraping IDs is safe at the default scan level: govulncheck only prints
          # "=== Symbol Results ===" there, so an advisory in a module we require but
          # never call has no ID in this output to scrape. Adding -show verbose or
          # -scan module would print Package/Module sections too, and then this would
          # need to stop at the first such header.
          FOUND_IDS=$(grep -oE 'GO-[0-9]{4}-[0-9]+' govulncheck.out | tr -d '\r' | sort -u || true)
          if [[ -z "$FOUND_IDS" ]]; then
            if [[ "$SCAN_EXIT" -ne 0 ]]; then
              echo "::error::govulncheck failed without producing vulnerability IDs"
              exit "$SCAN_EXIT"
            fi
            echo "No vulnerabilities found by govulncheck"
            exit 0
          fi

          ALLOWLIST_IDS=$(grep -vE '^[[:space:]]*#|^[[:space:]]*$' "$ALLOWLIST_FILE" | tr -d '\r' | sort -u)
          UNEXPECTED_IDS=$(comm -23 <(printf '%s\n' "$FOUND_IDS") <(printf '%s\n' "$ALLOWLIST_IDS") || true)

          if [[ -n "$UNEXPECTED_IDS" ]]; then
            echo "::error::Unexpected vulnerabilities found (not allowlisted):"
            echo "$UNEXPECTED_IDS"
            exit 1
          fi

          echo "::warning::Only allowlisted vulnerabilities were found:"
          echo "$FOUND_IDS"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t dockwatch:ci .

  publish:
    name: Publish image
    needs: [build-test, vuln, docker-build]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only let this tag own :latest if it is the highest released version, so a
      # backport or an accidental low tag can never downgrade :latest.
      - name: Decide whether this version owns :latest
        id: guard
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          cur="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$cur" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "is_highest=false" >> "$GITHUB_OUTPUT"
            echo "non-release tag ($cur): not touching :latest"; exit 0
          fi
          token=$(curl -sf "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r .token)
          # ponytail: single tags/list page (n=1000); paginate if tag count ever exceeds that.
          #
          # This step is now the only rule that sets :latest, so it must neither fail
          # the release on a transient blip nor quietly claim :latest when it could
          # not check. A 404 means the package does not exist yet, which is the first
          # release and genuinely is the highest; anything else stops the publish.
          code=$(curl -s -o "$RUNNER_TEMP/tags.json" -w '%{http_code}' -H "Authorization: Bearer $token" \
            "https://ghcr.io/v2/${repo}/tags/list?n=1000")
          if [ "$code" = "404" ]; then
            echo "package not published yet; treating $cur as the highest version"
            existing=""
          elif [ "$code" != "200" ]; then
            echo "::error::could not list existing tags (HTTP $code); refusing to guess about :latest"
            exit 1
          else
            existing=$(jq -r '.tags[]?' "$RUNNER_TEMP/tags.json" | sed -n 's/^v\?\([0-9]\+\.[0-9]\+\.[0-9]\+\)$/\1/p')
          fi
          highest=$(printf '%s\n%s\n' "$existing" "$cur" | sort -V | tail -1)
          echo "current=$cur highest=$highest"
          [ "$highest" = "$cur" ] \
            && echo "is_highest=true" >> "$GITHUB_OUTPUT" \
            || echo "is_highest=false" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # :latest means the highest released version, and the guard step above is
          # what decides that -- so it is the only rule allowed to set it. An
          # is_default_branch rule for :latest as well would republish it from
          # untagged main on every commit, which is exactly the pre-release code the
          # guard exists to keep away from everyone pulling :latest. Tip of main
          # gets its own channel instead: without that nothing would match on a main
          # push and the tag list would come out empty.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ steps.guard.outputs.is_highest }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without this the Dockerfile's ARG VERSION=dev default stands, so every
          # released image logged "Dockwatch dev" and sent User-Agent: Dockwatch/dev
          # to every registry. Tags get the semver; main gets a traceable sha.
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('main-{0}', github.sha) }}
