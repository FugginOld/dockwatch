name: Docs Validation

on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main

jobs:
  docs-validation:
    name: Markdown and Docs Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: docs-requirements.txt

      - name: Install docs dependencies
        run: |
          pip install -r docs-requirements.txt

      - name: MkDocs strict build
        run: |
          mkdocs build --strict

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: |
            README.md
            CONTRIBUTING.md
            SECURITY.md
            docs/**/*.md

      - name: Offline markdown link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --offline
            --include-fragments
            README.md
            CONTRIBUTING.md
            SECURITY.md
            docs/**/*.md
