name: Docs Validation

on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main

jobs:
  docs-validation:
    name: Markdown and Docs Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed markdown files
        id: changed-markdown
        uses: tj-actions/changed-files@v46
        with:
          files: |
            **/*.md
          separator: "\n"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: docs-requirements.txt

      - name: Install docs dependencies
        run: |
          pip install -r docs-requirements.txt

      - name: MkDocs strict build
        run: |
          mkdocs build --strict

      - name: Markdown lint
        if: steps.changed-markdown.outputs.any_changed == 'true'
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: ${{ steps.changed-markdown.outputs.all_changed_files }}

      - name: Offline markdown link check
        if: steps.changed-markdown.outputs.any_changed == 'true'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --offline
            --include-fragments
            ${{ steps.changed-markdown.outputs.all_changed_files }}
