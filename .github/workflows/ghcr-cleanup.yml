name: GHCR cleanup

# One-shot manual cleanup: delete every image version except the one tagged
# `latest`. Run with dry-run first to preview, then re-run with dry-run off.
# Delete this file once you have pruned the package.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Preview only (no deletions)"
        type: boolean
        default: true

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      # Pinned to an immutable commit rather than the mutable @v1 tag: this step is
      # handed a classic PAT that can delete any package on the account, so a
      # compromised upstream release would be able to destroy the published image
      # history. Delete this workflow and revoke the GHCR_PAT secret once the
      # package has been pruned -- both, since removing the file leaves the
      # credential live.
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1 as of v1.2.2
        with:
          package: dockwatch
          exclude-tags: latest,main
          keep-n-tagged: 0
          delete-untagged: true
          delete-partial-images: true
          dry-run: ${{ inputs.dry-run }}
          # User-owned package: GITHUB_TOKEN cannot delete it (deletes 404).
          # Use a classic PAT with delete:packages, stored as the GHCR_PAT secret.
          token: ${{ secrets.GHCR_PAT }}
