name: Pull Request

on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main

jobs:
  hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for temp and backup artifacts
        shell: bash
        run: |
          set -euo pipefail

          # Fail if tracked files include common temp/backup/editor artifacts.
          # These are almost always accidental commits.
          BAD_FILES=$(git ls-files | grep -E '(\.orig$|\.rej$|~$|\.tmp$|\.bak$|\.swp$|\.swo$|\.DS_Store$|Thumbs\.db$)' || true)

          if [[ -n "$BAD_FILES" ]]; then
            echo "::error::Repository contains temporary/backup artifact files:"
            echo "$BAD_FILES"
            exit 1
          fi

          echo "No temporary or backup artifact files found."

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.x
      - uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 #v1.4.1
        with:
          version: "latest"
          install-go: "false"
          checks: "all,-SA1019,-ST*"

  dependency-consistency:
    name: Dependency Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.x
      - name: Verify go.mod and go.sum are tidy
        shell: bash
        run: |
          set -euo pipefail

          go mod tidy

          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod/go.sum are out of sync. Run 'go mod tidy' and commit the changes."
            git --no-pager diff -- go.mod go.sum
            exit 1
          fi

          echo "go.mod/go.sum are tidy."

  race:
    name: Race Detection
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.x
      - name: Run race tests
        run: |
          go test -race ./...

  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.x
      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Run govulncheck with allowlist policy
        shell: bash
        run: |
          set -euo pipefail
          ALLOWLIST_FILE=.github/security/govuln-allowlist.txt

          if [[ ! -f "$ALLOWLIST_FILE" ]]; then
            echo "::error::Missing vulnerability allowlist: $ALLOWLIST_FILE"
            exit 1
          fi

          SCAN_EXIT=0
          govulncheck ./... > govulncheck.out 2>&1 || SCAN_EXIT=$?
          cat govulncheck.out

          FOUND_IDS=$(grep -oE 'GO-[0-9]{4}-[0-9]+' govulncheck.out | tr -d '\r' | sort -u || true)
          if [[ -z "$FOUND_IDS" ]]; then
            if [[ "$SCAN_EXIT" -ne 0 ]]; then
              echo "::error::govulncheck failed without producing vulnerability IDs"
              exit "$SCAN_EXIT"
            fi
            echo "No vulnerabilities found by govulncheck"
            exit 0
          fi

          ALLOWLIST_IDS=$(grep -vE '^[[:space:]]*#|^[[:space:]]*$' "$ALLOWLIST_FILE" | tr -d '\r' | sort -u)
          UNEXPECTED_IDS=$(comm -23 <(printf '%s\n' "$FOUND_IDS") <(printf '%s\n' "$ALLOWLIST_IDS") || true)

          if [[ -n "$UNEXPECTED_IDS" ]]; then
            echo "::error::Unexpected vulnerabilities found (not allowlisted):"
            echo "$UNEXPECTED_IDS"
            exit 1
          fi

          echo "::warning::Only allowlisted vulnerabilities were found:"
          echo "$FOUND_IDS"

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - 1.25.x
        platform:
          - macos-latest
          - windows-latest
          - ubuntu-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run tests
        run: |
          go test -v -coverprofile coverage.out -covermode atomic ./... 
      - name: Publish coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.x
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build
        uses: goreleaser/goreleaser-action@e24998b8b67b290c2fa8b7c14fcfa7de2c5c9b8c #v7.1.0
        with:
          version: v2.15.2
          args: --snapshot --skip=publish
