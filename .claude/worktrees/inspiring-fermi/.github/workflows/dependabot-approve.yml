name: Auto approve dependabot PRs

on: pull_request_target

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Approval skipped
        run: |
          echo "Automatic approval is disabled due GitHub policy restrictions for Actions-created reviews."
          echo "Maintainer review is required."
