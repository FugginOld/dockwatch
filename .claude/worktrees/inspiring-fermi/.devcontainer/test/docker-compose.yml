version: "3.8"

services:
  test-nginx:
    image: nginx:1.25.3
    container_name: test-nginx
    restart: unless-stopped

  dockwatch:
    build:
      context: ..
      dockerfile: dockerfiles/Dockerfile
    container_name: test-dockwatch
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 10 test-nginx