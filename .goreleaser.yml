version: 2

project_name: dockwatch

before:
  hooks:
    - go mod tidy

builds:
  - id: dockwatch
    main: .
    binary: dockwatch
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/fugginold/dockwatch/internal/meta.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - "386"
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

dockers_v2:
  - dockerfile: Dockerfile
    images:
      - "fugginold/dockwatch"
    tags:
      - "{{ .Tag }}"
      - latest
      - stable
    platforms:
      - linux/amd64
      - linux/arm64

release:
  draft: false
  prerelease: false
