version: 2

project_name: dockwatch

before:
  hooks:
    - go mod tidy

builds:
  - id: dockwatch
    main: .
    binary: dockwatch
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - "386"
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

dockers:
  - image_templates:
      - "fugginold/dockwatch:{{ .Tag }}-amd64"
    dockerfile: Dockerfile
    use: buildx
    goos: linux
    goarch: amd64
    build_flag_templates:
      - "--platform=linux/amd64"

  - image_templates:
      - "fugginold/dockwatch:{{ .Tag }}-arm64"
    dockerfile: Dockerfile
    use: buildx
    goos: linux
    goarch: arm64
    build_flag_templates:
      - "--platform=linux/arm64"

docker_manifests:
  - name_template: "fugginold/dockwatch:{{ .Tag }}"
    image_templates:
      - "fugginold/dockwatch:{{ .Tag }}-amd64"
      - "fugginold/dockwatch:{{ .Tag }}-arm64"

  - name_template: "fugginold/dockwatch:latest"
    image_templates:
      - "fugginold/dockwatch:{{ .Tag }}-amd64"
      - "fugginold/dockwatch:{{ .Tag }}-arm64"

  - name_template: "fugginold/dockwatch:stable"
    image_templates:
      - "fugginold/dockwatch:{{ .Tag }}-amd64"
      - "fugginold/dockwatch:{{ .Tag }}-arm64"

release:
  draft: false
  prerelease: false
